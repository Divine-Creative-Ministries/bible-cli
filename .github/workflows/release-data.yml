name: Build and release databases
on:
  workflow_dispatch:
  push:
    tags: ['data-v*']

jobs:
  build-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Download raw sources
        run: bash pipeline/download.sh
      - name: Build databases (with verification)
        run: npx tsx pipeline/build.ts
      - name: Compress artifacts and write manifest
        run: |
          gzip -9 -k data/dist/bible-core.db
          gzip -9 -k data/dist/bible-study.db
          gzip -9 -k data/dist/bible-lxx.db
          cd data/dist
          shasum -a 256 bible-core.db bible-study.db bible-lxx.db *.gz > SHA256SUMS
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const files = {};
            for (const f of ["bible-core.db.gz","bible-study.db.gz","bible-lxx.db.gz"]) {
              const buf = fs.readFileSync(f);
              files[f] = { sha256: crypto.createHash("sha256").update(buf).digest("hex"), bytes: buf.length };
            }
            fs.writeFileSync("manifest.json", JSON.stringify({ schema_version: "1", files }, null, 2));
          '
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            data/dist/bible-core.db.gz
            data/dist/bible-study.db.gz
            data/dist/bible-lxx.db.gz
            data/dist/manifest.json
            data/dist/SHA256SUMS
