name: Build and release databases
on:
  workflow_dispatch:
  push:
    tags: ['data-v*']

jobs:
  build-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Download raw sources
        run: bash pipeline/download.sh
      - name: Build databases (with verification)
        run: npx tsx pipeline/build.ts
      - name: Compress artifacts
        run: |
          gzip -9 -k data/dist/bible-core.db
          gzip -9 -k data/dist/bible-study.db
          (cd data/dist && shasum -a 256 bible-core.db bible-study.db *.gz > SHA256SUMS)
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            data/dist/bible-core.db.gz
            data/dist/bible-study.db.gz
            data/dist/SHA256SUMS
