name: Regenerate docs
on:
  push:
    branches: [main]
    paths: ['src/**', 'pipeline/build.ts', 'scripts/gen-docs.ts']

jobs:
  gen-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run gen-docs
      - name: Commit drift if any
        run: |
          if ! git diff --quiet; then
            git config user.name "docs-bot"
            git config user.email "docs-bot@users.noreply.github.com"
            git add docs README.md
            git commit -m "docs: regenerate from CLI [skip ci]"
            git push
          else
            echo "docs already current"
          fi
      - name: Nudge the landing page to sync
        continue-on-error: true
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.LANDING_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Divine-Creative-Ministries/bible-cli-landing-page/dispatches \
            -d '{"event_type":"bible-cli-updated"}' || echo "no dispatch token — landing syncs on its daily schedule"
