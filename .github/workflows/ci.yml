name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Older-glibc smoke: Debian bookworm (glibc 2.36) mirrors the sandboxed
  # environments (ChatGPT/Codex containers, older distros) where prebuilt
  # native binaries have broken before. The tarball is packed on the host
  # (packing the dev tree is not what end users do), then installed inside
  # the container exactly as a user would. node:20-bookworm keeps a
  # toolchain so a source-build fallback is also exercised.
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: '*bible-cli-*.tgz'

  compat-smoke:
    needs: pack
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ['node:20-bookworm', 'node:22-bookworm-slim']
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
      - name: Install and exercise on old glibc
        run: |
          mkdir /tmp/smoke && cd /tmp/smoke
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/*bible-cli-*.tgz
          npx bible doctor || true
          npx bible ref "jn 3 16" --json
          npx bible passage "John 3:16" | grep -q "loved the world" && echo "compat OK"

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm pack
      - name: Install packed tarball into a clean directory and run it
        run: |
          mkdir /tmp/smoke && cd /tmp/smoke
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/*bible-cli-*.tgz
          npx bible --version
          npx bible ref "jn 3 16" --json
          npx bible db status || true
          # with auto-download disabled, the no-data error must be helpful
          BIBLE_CLI_NO_AUTO_DOWNLOAD=1 npx bible passage "John 3:16" 2>&1 | grep -q "bible db download" && echo "opt-out message OK"
          # default behavior: first use auto-downloads from the release and answers
          npx bible passage "John 3:16" | grep -q "loved the world" && echo "auto-provisioning OK"
